<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Contact · Piyush Kumar</title>
<meta name="description" content="Get in touch with Piyush Kumar about internships, projects and collaborations." />
<link rel="icon" href="/assets/favicon.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script>
  (function () {
    try { document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') === 'light' ? 'light' : 'dark'); } catch (e) {}
  })();
</script>
<style>
  :root, [data-theme="dark"] {
    --bg: #0a0a0a; --chip: #161616; --fg: #fafafa; --fg-2: #d4d4d4; --muted: #a1a1a1; --faint: #6b6b6b;
    --line: rgba(255,255,255,.1); --line-strong: rgba(255,255,255,.16); --hatch: rgba(255,255,255,.035);
    --btn-bg: #fafafa; --btn-fg: #0a0a0a; --shadow: 0 10px 40px rgba(0,0,0,.5); color-scheme: dark;
  }
  [data-theme="light"] {
    --bg: #ffffff; --chip: #f5f5f5; --fg: #0a0a0a; --fg-2: #262626; --muted: #737373; --faint: #a3a3a3;
    --line: rgba(0,0,0,.1); --line-strong: rgba(0,0,0,.16); --hatch: rgba(0,0,0,.04);
    --btn-bg: #0a0a0a; --btn-fg: #fafafa; --shadow: 0 10px 40px rgba(0,0,0,.12); color-scheme: light;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { overflow-x: clip; }
  body { background: var(--bg); color: var(--fg); font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; line-height: 1.5; overflow-x: clip; }
  a { color: inherit; text-decoration: none; }
  .serif { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; letter-spacing: -0.01em; }
  .mono { font-family: 'Geist Mono', ui-monospace, monospace; }
  .frame { max-width: 800px; margin: 0 auto; min-height: 100vh; border-left: 1px dashed var(--line-strong); border-right: 1px dashed var(--line-strong); display: flex; flex-direction: column; }
  .hl { position: relative; }
  .hl::after { content: ''; position: absolute; left: -100vw; right: -100vw; bottom: 0; border-top: 1px dashed var(--line-strong); pointer-events: none; }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 22px; }
  .back { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; letter-spacing: .08em; color: var(--muted); transition: color .2s; }
  .back:hover { color: var(--fg); }
  .back svg { width: 15px; height: 15px; transition: transform .2s; }
  .back:hover svg { transform: translateX(-3px); }
  .avail { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--fg-2); border: 1px solid var(--line-strong); border-radius: 6px; padding: 4px 10px; background: var(--chip); }
  .avail i { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 0 rgba(34,197,94,.6); animation: ping 2s infinite; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(34,197,94,.55); } 70% { box-shadow: 0 0 0 6px rgba(34,197,94,0); } 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); } }
  .theme { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 9px; border: 1px solid transparent; background: none; color: var(--fg); cursor: pointer; }
  .theme:hover { background: var(--chip); border-color: var(--line); }
  .theme svg { width: 17px; height: 17px; }
  .sun { display: none; } [data-theme="dark"] .sun { display: block; } [data-theme="dark"] .moon { display: none; }
  .right { display: flex; align-items: center; gap: 8px; }

  .head { padding: 40px 22px 30px; }
  .head h1 { font-size: 64px; line-height: 1; }
  .head p { font-size: 18px; color: var(--muted); margin-top: 10px; }

  form { padding: 30px 22px 10px; display: grid; gap: 26px; }
  .field label { display: block; font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: .1em; color: var(--faint); text-transform: uppercase; }
  .field input, .field textarea {
    width: 100%; background: transparent; border: 0; border-bottom: 1px solid var(--line-strong); color: var(--fg);
    font: 400 16.5px 'Inter', sans-serif; padding: 12px 2px 14px; outline: none; transition: border-color .25s; resize: vertical;
  }
  .field textarea { min-height: 120px; }
  .field input::placeholder, .field textarea::placeholder { color: var(--faint); }
  .field input:focus, .field textarea:focus { border-bottom-color: var(--fg); }
  .field:focus-within label { color: var(--fg); }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }

  .actions { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-top: 6px; }
  .send {
    display: inline-flex; align-items: center; gap: 10px; background: var(--btn-bg); color: var(--btn-fg); border: 0; cursor: pointer;
    font: 600 16px 'Inter', sans-serif; padding: 13px 28px; border-radius: 999px; box-shadow: var(--shadow); transition: transform .2s, opacity .2s;
  }
  .send:hover { transform: translateY(-2px); }
  .send svg { width: 17px; height: 17px; transition: transform .2s; }
  .send:hover svg { transform: translateX(3px); }
  .send[disabled] { opacity: .6; cursor: progress; transform: none; }
  .status { font-size: 14px; color: var(--muted); }
  .status.ok { color: #22c55e; } .status.err { color: #f87171; }
  .alt { font-size: 13.5px; color: var(--muted); padding: 26px 22px 40px; }
  .alt a { color: var(--fg); text-decoration: underline; text-underline-offset: 3px; }

  .done { display: none; padding: 50px 22px 60px; text-align: center; }
  .done .tick { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto; border: 1px solid var(--line-strong); background: var(--chip); }
  .done .tick svg { width: 24px; height: 24px; color: #22c55e; }
  .done h2 { font-size: 40px; margin-top: 16px; }
  .done p { color: var(--muted); margin-top: 6px; }
  .done a { display: inline-flex; margin-top: 22px; font-size: 14px; border: 1px solid var(--line-strong); border-radius: 999px; padding: 8px 18px; }
  .done a:hover { background: var(--chip); }
  .sent form, .sent .alt { display: none; } .sent .done { display: block; }

  .rv { opacity: 0; transform: translateY(14px); filter: blur(4px); animation: in .8s cubic-bezier(.2,.7,.2,1) forwards; }
  .rv:nth-child(2) { animation-delay: .08s; } .rv:nth-child(3) { animation-delay: .16s; }
  @keyframes in { to { opacity: 1; transform: none; filter: none; } }
  @media (prefers-reduced-motion: reduce) { .rv { animation: none; opacity: 1; transform: none; filter: none; } }
  @media (max-width: 600px) { .head h1 { font-size: 48px; } .avail span { display: none; } }
</style>
</head>
<body>
<main class="frame" id="page">
  <div class="top hl">
    <a class="back mono" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>HOME</a>
    <div class="right">
      <span class="avail"><i></i><span>Open to internships &amp; collaborations</span></span>
      <button class="theme" id="themeBtn" aria-label="Toggle theme">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </div>

  <div class="head hl rv">
    <h1 class="serif">Let's Connect</h1>
    <p>Let's talk about internships, projects or your next idea.</p>
  </div>

  <form id="form" class="rv" novalidate>
    <input class="hp" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true" />
    <div class="field"><label for="name">Name</label><input id="name" name="name" type="text" placeholder="What should I call you?" required maxlength="100" autocomplete="name" /></div>
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" placeholder="How can I contact you?" required maxlength="200" autocomplete="email" /></div>
    <div class="field"><label for="message">Message</label><textarea id="message" name="message" placeholder="Tell me about your project..." required maxlength="5000"></textarea></div>
    <div class="actions">
      <button class="send" type="submit" id="send">Send Message <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      <span class="status" id="status" role="status" aria-live="polite"></span>
    </div>
  </form>
  <p class="alt rv">Prefer email? Write to <a href="mailto:piyushkumar52679@gmail.com">piyushkumar52679@gmail.com</a></p>

  <section class="done" aria-live="polite">
    <div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
    <h2 class="serif">Message sent</h2>
    <p>Thanks for reaching out. I'll get back to you soon.</p>
    <a href="/">← Back to home</a>
  </section>
</main>

<script>
  document.getElementById('themeBtn').addEventListener('click', () => {
    const r = document.documentElement, next = r.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    const apply = () => { r.setAttribute('data-theme', next); try { localStorage.setItem('theme', next); } catch (_) {} };
    document.startViewTransition ? document.startViewTransition(apply) : apply();
  });

  // Submissions are delivered to Piyush's inbox via FormSubmit (formsubmit.co).
  const ENDPOINT = 'https://formsubmit.co/ajax/piyushkumar52679@gmail.com';
  const form = document.getElementById('form'), statusEl = document.getElementById('status'), btn = document.getElementById('send');
  const say = (t, c = '') => { statusEl.textContent = t; statusEl.className = 'status ' + c; };

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(form));
    if (d._honey) return;
    if (!d.name.trim() || !d.email.trim() || !d.message.trim()) return say('Please fill in all three fields.', 'err');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email.trim())) return say('That email doesn\'t look right.', 'err');
    btn.disabled = true; say('Sending…');
    try {
      const r = await fetch(ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({
          name: d.name.trim(), email: d.email.trim(), message: d.message.trim(),
          _subject: `Portfolio message from ${d.name.trim()}`, _replyto: d.email.trim(),
          _template: 'table', _captcha: 'false'
        })
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || String(j.success) === 'false') throw new Error(j.message || 'failed');
      document.getElementById('page').classList.add('sent');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (_) {
      say('Couldn\'t send right now. Please email me directly instead.', 'err');
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
